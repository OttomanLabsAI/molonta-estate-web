<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Not found — Molonta Heritage Estate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root{--bg:#ffffff;--ink:#3d2b1f;--accent:#b0512c;--deep:#2c2016;--cream:#f4ecdf}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font:400 16.5px/1.6 "Inter",system-ui,-apple-system,sans-serif;text-align:center;
      padding:24px}
    h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
      font-size:clamp(2.4rem,10vw,4.4rem);line-height:1.04;margin:0 0 .35em;
      max-width:none;hyphens:none;overflow-wrap:normal;letter-spacing:.04em}
    p{max-width:44ch;margin:0 auto 26px}
    .btn{display:inline-block;background:var(--accent);color:#fff;
      font:600 15px/1 "Inter",system-ui,sans-serif;letter-spacing:.05em;
      text-transform:uppercase;padding:16px 28px;text-decoration:none}
    .kicker{font:600 11.5px/1.4 "Inter",system-ui,sans-serif;letter-spacing:.22em;
      text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  </style>
</head>
<body>
<style id="pitch-bar-css">
  #pitch-bar{position:fixed;top:0;left:0;right:0;z-index:2147483000;
    box-sizing:border-box;display:flex;align-items:center;gap:6px;height:48px;
    padding:0 12px;background:#0c0c0c;color:#eee;
    font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
    border-bottom:2px solid var(--pitch-accent,#e8b33a)}
  #pitch-bar *{box-sizing:border-box;margin:0}
  #pitch-bar .pitch-chip{background:var(--pitch-accent,#e8b33a);color:#0c0c0c;
    font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 7px;border-radius:3px;margin-right:6px;flex:none}
  #pitch-bar a{color:#bdbdbd;text-decoration:none;padding:16px 10px 14px;
    white-space:nowrap;border-bottom:3px solid transparent}
  #pitch-bar a:hover{color:#fff}
  #pitch-bar a[aria-current="page"]{color:#fff;
    border-bottom-color:var(--pitch-accent,#e8b33a)}
  body{padding-top:48px !important}
  @media (max-width:479px){
    #pitch-bar{padding:0 6px;gap:2px}
    #pitch-bar a{padding:16px 7px 14px;font-size:12px}
    #pitch-bar .pitch-chip{margin-right:2px}
  }
</style>
<nav id="pitch-bar" aria-label="Demo pages">
  <span class="pitch-chip">Demo</span>
  <a href="/">New site</a>
  <a href="/original/">Current site</a>
  <a href="/offer/">The offer</a>
</nav>
<main>
  <p class="kicker">Molonta Heritage Estate — demo</p>
  <h1>Off the stone path</h1>
  <p>That page isn't part of this demo. The bay, the olives and the rest of the
    site are one tap away.</p>
  <a class="btn" href="/">Back to the estate</a>
</main>
</body>
</html>
